<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>时间分类统计</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#253247;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:980px;margin:24px auto;padding:0 18px}section{background:white;border:1px solid #e4e9ef;border-radius:16px;padding:22px;margin-bottom:16px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 12px}.muted{color:#6d7889;font-size:14px}.total{font-size:28px;font-weight:750;margin:10px 0 0}.total small{font-size:16px;font-weight:400}.bar{display:flex;width:100%;height:48px;border-radius:9px;overflow:hidden;background:#eef1f5;margin:16px 0}.segment{display:flex;justify-content:center;align-items:center;color:white;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden}.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 20px}.key{display:flex;align-items:center;gap:7px;font-size:14px}.dot{width:10px;height:10px;border-radius:3px;flex:none}.key strong{margin-left:auto;font-variant-numeric:tabular-nums}label{display:block;font-weight:650;margin-bottom:8px}textarea{font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif;width:100%;height:270px;resize:vertical;padding:14px;border:1px solid #cbd5e1;border-radius:9px;color:#253247;background:#fcfdff}textarea:focus{outline:2px solid #9ebaf3;border-color:#3767b2}button{font:inherit;border:1px solid #ced7e2;background:white;border-radius:8px;padding:8px 24px;cursor:pointer}button.primary{background:#315fac;color:white;border-color:#315fac}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:15px}th,td{padding:12px 8px;border-bottom:1px solid #e9edf2;vertical-align:top}th{background:#f7f9fc;color:#667389;font-weight:500}th:last-child,td:last-child{text-align:right;white-space:nowrap}td:first-child{white-space:nowrap;font-variant-numeric:tabular-nums}.notice{color:#975c08;background:#fff8e8;border-radius:8px;padding:10px 14px;margin-top:12px;font-size:14px;white-space:pre-line}.empty{padding:20px;color:#7b8797;text-align:center}details{margin-top:12px;font-size:14px;color:#6d7889}pre{white-space:pre-wrap;font:inherit;background:#f6f8fb;padding:12px;border-radius:8px}@media(max-width:620px){main{margin:12px auto;padding:0 10px}section{padding:16px}.legend{grid-template-columns:1fr 1fr;gap:12px}.key{font-size:12px;flex-wrap:wrap}.key strong{margin-left:0}header{align-items:flex-start}h1{font-size:20px}.total{font-size:25px}th,td{padding:10px 6px;font-size:13px}}
</style></head><body><main>
<section><header><h1>时间分类统计</h1><span id="date" class="muted">等待输入日期</span></header><div class="total" id="total">总计 0 小时</div><div id="minutes" class="muted">0 分钟</div><div id="bar" class="bar" role="img" aria-label="暂无时长数据"></div><div class="legend" id="legend"></div></section>
<section><label for="input">输入工作记录</label><textarea id="input" placeholder="10月18日 周日&#10;8：00-9：30&#10;项目四常规教学。可用性备课。补充课堂案例。&#10;9：30-10：00&#10;项目一毕设案例。阅读文献。" spellcheck="false"></textarea><div class="actions"><button id="reset" type="button">重置</button><button id="analyze" type="button" class="primary">分析</button></div><details><summary>输入格式说明</summary><p>第一行填写日期。每个起止时间段单独一行，下一非空行填写“类型。任务。其他内容”。任务取类型后的第一个句子。</p><pre>10月18日 周日
8：00-9：30
项目四常规教学。可用性备课。补充课堂案例。
9：30-10：00
杂工作。回复工作消息。</pre><p>支持中文／英文冒号，以及 -、—、～、至 等时间分隔符。结束早于开始按跨午夜计算；相同起止时间计 0 分钟。各段分别相加，重叠时间会提示。无法识别的类型或时间不会计入总计。</p></details><div id="notice" role="status" hidden class="notice"></div></section>
<section aria-live="polite"><h2>任务明细 <span class="muted" id="count"></span></h2><div id="empty" class="empty">粘贴记录后，点击“分析”</div><div class="tablewrap"><table id="table" hidden><thead><tr><th>时间段</th><th>类型－任务</th><th>时长</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main><script>
const TYPES=['项目一毕设案例','项目二学术演示','项目三论文教材','项目四常规教学','杂','杂工作'];
const COLORS=['#4776c5','#7b66bd','#339388','#d09136','#9aa5b5','#c77380'];
const $=id=>document.getElementById(id);
function parseRecord(text){
 const lines=text.replace(/\r/g,'').split('\n');let first=lines.findIndex(l=>l.trim());if(first<0)return{date:'',records:[],warnings:['请先输入工作记录。']};
 const date=lines[first].trim(),records=[],warnings=[];
 const pattern=/^(\d{1,2})\s*:\s*(\d{1,2})\s*[-—–－~～至到]+\s*(\d{1,2})\s*:\s*(\d{1,2})\s*$/;
 for(let i=first+1;i<lines.length;i++){
 const line=lines[i].trim().replace(/：/g,':');if(!/^\d/.test(line))continue;
 const m=line.match(pattern);if(!m){warnings.push(`第 ${i+1} 行时间格式无法识别，未计入：${lines[i].trim()}`);continue;}
 const [h1,m1,h2,m2]=m.slice(1).map(Number);if(h1>23||h2>24||m1>59||m2>59||(h2===24&&m2!==0)){warnings.push(`第 ${i+1} 行时间超出有效范围，未计入。`);continue;}
 let j=i+1;while(j<lines.length&&!lines[j].trim())j++;
 const desc=(lines[j]||'').trim();const category=[...TYPES].sort((a,b)=>b.length-a.length).find(t=>desc.startsWith(t)&&(!desc[t.length]||/[。．.!！?？；;：:\s\-—]/.test(desc[t.length])));
 if(!category){warnings.push(`第 ${i+1} 行时间段下方缺少有效类型，未计入。`);continue;}
 const rest=desc.slice(category.length).replace(/^[。．.!！?？；;：:\s\-—]+/,'');
 const task=rest.split(/[。．.!！?？；;\n]/)[0].trim()||'（未填写任务）';
 const start=h1*60+m1;let end=h2*60+m2;if(end<start)end+=1440;
 records.push({category,task,start,end,minutes:end-start,time:`${String(h1).padStart(2,'0')}:${String(m1).padStart(2,'0')}–${String(h2).padStart(2,'0')}:${String(m2).padStart(2,'0')}${end>1440?'（次日）':''}`});
 }
 if(records.some((a,i)=>records.slice(i+1).some(b=>a.start<b.end&&b.start<a.end)))warnings.push('存在重叠时间段，仍按每条记录分别相加，请核对。');
 if(!records.length)warnings.push('未找到可统计的记录；请检查时间段和类型格式。');
 return{date,records,warnings};
}
function render(result){
 const sums=TYPES.map(t=>result.records.filter(r=>r.category===t).reduce((s,r)=>s+r.minutes,0)),total=sums.reduce((a,b)=>a+b,0);
 $('date').textContent=result.date||'等待输入日期';$('total').textContent=`总计 ${Number((total/60).toFixed(2))} 小时`;$('minutes').textContent=`${total} 分钟 · ${Math.floor(total/60)} 小时 ${total%60} 分钟`;
 $('bar').replaceChildren();$('legend').replaceChildren();TYPES.forEach((t,i)=>{const legend=document.createElement('div');legend.className='key';const dot=document.createElement('span');dot.className='dot';dot.style.background=COLORS[i];const name=document.createElement('span');name.textContent=t;const value=document.createElement('strong');value.textContent=`${sums[i]} 分钟`;legend.append(dot,name,value);$('legend').append(legend);if(sums[i]&&total){const segment=document.createElement('div');segment.className='segment';segment.style.width=`${sums[i]/total*100}%`;segment.style.background=COLORS[i];segment.title=`${t}：${sums[i]} 分钟（${(sums[i]/total*100).toFixed(1)}%）`;segment.textContent=sums[i]/total>=.09?`${sums[i]}分`:'';$('bar').append(segment);}});
 $('bar').setAttribute('aria-label',TYPES.map((t,i)=>`${t}${sums[i]}分钟`).join('，'));$('rows').replaceChildren();result.records.forEach(r=>{const tr=document.createElement('tr');[r.time,`${r.category}-${r.task}`,`${r.minutes} 分钟`].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td);});$('rows').append(tr);});$('table').hidden=!result.records.length;$('empty').hidden=!!result.records.length;$('count').textContent=result.records.length?`· ${result.records.length} 条`:'';$('notice').hidden=!result.warnings.length;$('notice').textContent=result.warnings.join('\n');
}
$('analyze').addEventListener('click',()=>render(parseRecord($('input').value)));
$('reset').addEventListener('click',()=>{$('input').value='';render({date:'',records:[],warnings:[]});$('input').focus();});
render({date:'',records:[],warnings:[]});
</script></body></html>
