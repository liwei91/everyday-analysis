<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>时间有迹 · 工作时长统计</title><style>
:root{--ink:#203b38;--muted:#637773;--green:#216c5a;--line:#dce6df;--bg:#f4f6f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1000px;margin:auto;padding:40px 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--green)}h1{font-size:30px;margin:3px 0}h2{font-size:22px;margin:0 0 12px}h3{font-size:17px;margin:0}.muted,small{color:var(--muted)}.badge{padding:6px 14px;border:1px solid var(--line);border-radius:30px;font-size:13px}nav{display:flex;gap:8px;margin:24px 0}button,.filebtn{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:9px 19px;background:white;color:var(--ink)}button:hover,.filebtn:hover{border-color:var(--green)}button:focus-visible,textarea:focus-visible{outline:3px solid #b69d49;outline-offset:3px}button.active,.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.45;cursor:default}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:28px;margin:18px 0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;background:#e8eee4}.big{font-size:26px;font-weight:650}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.chartrow{margin:28px 0}.chartlabel{display:flex;justify-content:space-between;gap:12px;margin-bottom:9px}.track{height:22px;background:#edf1eb;border-radius:6px;overflow:hidden}.fill{height:100%;background:var(--green);border-radius:6px;transition:width .35s}.chartrow:nth-child(2) .fill{background:#558579}.chartrow:nth-child(3) .fill{background:#969f5b}.chartrow:nth-child(4) .fill{background:#c09a60}textarea{display:block;width:100%;min-height:310px;resize:vertical;border:1px solid #bdcdc5;border-radius:12px;padding:18px;font:16px/1.5 system-ui;background:#fcfdfb;color:var(--ink);margin:15px 0}.help{background:#f5f7f2;padding:14px 18px;border-radius:10px;font-size:14px}pre{white-space:pre-wrap;font:inherit}.group{border-top:1px solid var(--line);padding:20px 0}.group ul{margin:8px 0;padding-left:22px}.warning{background:#fff7e4;color:#785518;padding:14px;border-radius:10px;margin:12px 0}.empty{text-align:center;padding:30px 10px;color:var(--muted)}[hidden]{display:none!important}footer{font-size:13px;color:var(--muted);margin:24px 0}#message{color:var(--green)}#message:empty{display:none}.result-actions{margin-top:16px}.result-actions button{width:100%}header{margin-bottom:12px}nav{margin:12px 0}#input>.card:first-child textarea{margin-top:0}@media(max-width:600px){header{margin-bottom:8px}h1{font-size:25px}main{padding-top:16px}#input>.card:first-child{padding:16px}}.history{border-top:1px solid var(--line);padding:15px 0}.danger{color:#a24133;font-size:13px;padding:5px 12px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.tools button,.tools .filebtn{font-size:13px;padding:6px 12px}details summary{cursor:pointer}#result{scroll-margin-top:20px}@media(max-width:600px){main{padding:24px 16px}.card{padding:20px}.badge{display:none}.summary{gap:12px;grid-template-columns:1fr}.summary>div{display:flex;justify-content:space-between;align-items:center}.big{font-size:22px}.chartlabel{font-size:14px}}
.daily{overflow-x:auto;margin-top:16px;-webkit-overflow-scrolling:touch}.daily svg{display:block;max-width:none}.legend{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:13px;margin-bottom:10px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}.daily [role="button"]{cursor:pointer}.daily [role="button"]:focus{outline:2px solid #216c5a}.history summary{font-size:14px}.history pre{font-size:14px;overflow-wrap:anywhere}</style></head><body><main><header><h1>时间有迹</h1></header>
<nav role="tablist" aria-label="工作记录"><button id="tab-stats" role="tab" aria-selected="true" aria-controls="stats" class="active">01 统计</button><button id="tab-input" role="tab" aria-selected="false" aria-controls="input">02 内容</button></nav><div id="message" role="status" aria-live="polite"></div>
<section id="stats" role="tabpanel" aria-labelledby="tab-stats"><div class="card"><h2>让长期投入有迹可循</h2><div id="period" class="muted"></div><div id="summary" class="card summary"></div><div id="chart" aria-label="各项目累计时长条形图"></div><small>条形长度按累计分钟数同比例显示；杂类、小说与无法归类内容不计入项目累计。</small></div><div class="card"><h2>每日工作时长</h2><div id="daily-legend" class="legend"></div><small>每天一根堆叠柱，仅显示已记录日期，不含杂类和小说。左右滑动查看，点击柱子查看明细。</small><div id="daily" class="daily" aria-label="每日四项目堆叠柱形图"></div><div id="daily-detail" class="help" aria-live="polite" hidden></div></div><div class="card"><div class="row"><h2>已加入的每日记录</h2><button id="go-input">＋ 添加记录</button></div><div id="history"></div></div><div class="tools"><button id="export">导出备份</button><label class="filebtn" for="import">导入备份</label><input type="file" id="import" accept="application/json,.json" hidden></div></section>
<section id="input" role="tabpanel" aria-labelledby="tab-input" hidden><div class="card"><textarea aria-label="粘贴工作记录" id="source" placeholder="2026-10-1&#10;8：00—9：30&#10;项目一毕设案例&#10;&#10;10：00—11：00&#10;项目二学术演示"></textarea><div class="row"><small id="count">0 / 3000 字</small><div><button id="reset">重置</button> <button id="analyze" class="primary">开始分析</button></div></div></div><div id="result" class="card" hidden></div></section><footer>数据仅保存在当前浏览器，不会上传至 GitHub，也不会自动跨设备同步。请定期导出备份；清理浏览器数据可能删除记录。</footer></main>
<script>
'use strict';
const NAMES=['项目一毕设案例','项目二学术演示','项目三论文教材','项目四常规教学','杂','小说'];
const KEY='time-trace-records-v1';let records=[],current=null;const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=m=>`${Math.floor(m/60)}小时${m%60}分`;
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dateParse(line){let s=line.trim().replace(/(?:周|星期)[一二三四五六日天]\s*$/,'').trim();let y,m,d,a;if(a=s.match(/^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})日?$/)){[,y,m,d]=a;}else if(a=s.match(/^(\d{1,2})[-/.月](\d{1,2})日?$/)){y=new Date().getFullYear();[,m,d]=a;}else throw Error('第一行日期无法识别，请使用 2026-10-1 格式。');const dt=new Date(Date.UTC(+y,+m-1,+d));if(+y<1900||dt.getUTCFullYear()!=+y||dt.getUTCMonth()!=+m-1||dt.getUTCDate()!=+d)throw Error('日期不存在，请检查第一行。');return `${y}-${String(+m).padStart(2,'0')}-${String(+d).padStart(2,'0')}`;}
function category(s){const a=s.match(/^项目\s*([一二三四1234])/);if(a)return '一二三四'.includes(a[1])?'一二三四'.indexOf(a[1]):+a[1]-1;return /^杂/.test(s)?4:/^小说/.test(s)?5:-1;}
function analyzeText(raw){if([...raw].length>3000)throw Error('文本超过 3000 字，请按天精简后分析。');const lines=raw.replace(/\r\n?/g,'\n').replace(/[\u2028\u2029\v]/g,'\n').trim().split('\n');if(!raw.trim())throw Error('请先粘贴工作记录。');const date=dateParse(lines[0]);if(date>today())throw Error('日期晚于今天，请检查日期或年份。');const entries=[],unknown=[],warnings=[];let i=1;while(i<lines.length){if(!lines[i].trim()){i++;continue;}const start=i;let block=[lines[i++].trim()];if(/^\d/.test(block[0])){while(i<lines.length&&!/^\d/.test(lines[i].trim()))block.push(lines[i++].trim());const t=block[0].replace(/：/g,':').match(/^(\d{1,2})\s*:\s*(\d{1,2})\s*(?:[-—–－~～]+|至|到)\s*(\d{1,2})\s*:\s*(\d{1,2})\s*$/);if(!t||+t[1]>23||+t[2]>59||+t[3]>24||+t[4]>59||(+t[3]===24&&+t[4]!==0)){unknown.push({line:start+1,text:block.join('\n'),reason:'时间段格式无法识别'});continue;}const content=block.slice(1).filter(line=>line.trim());const ci=category(content[0]||'');if(ci<0){unknown.push({line:start+1,text:block.join('\n'),reason:'时间段后第一个非空行缺少有效类别'});continue;}const from=+t[1]*60 + +t[2];let to=+t[3]*60 + +t[4];if(to<from)to+=1440;entries.push({category:ci,minutes:to-from,from,to,label:`${t[1].padStart(2,'0')}:${t[2].padStart(2,'0')}—${t[3].padStart(2,'0')}:${t[4].padStart(2,'0')}${to>1440?'（次日）':''}`,notes:content.slice(1).join('\n')});}else{while(i<lines.length&&!/^\d/.test(lines[i].trim()))block.push(lines[i++].trim());unknown.push({line:start+1,text:block.join('\n'),reason:'没有对应的时间段'});}}
for(let a=0;a<entries.length;a++)for(let b=a+1;b<entries.length;b++)if(Math.max(entries[a].from,entries[b].from)<Math.min(entries[a].to,entries[b].to))warnings.push(`${entries[a].label} 与 ${entries[b].label} 重叠，仍分别累计。`);
return {date,raw,entries,unknown,warnings};}
function totals(r){const t=[0,0,0,0,0,0];r.entries.forEach(e=>t[e.category]+=e.minutes);return t;}
function tab(name){['stats','input'].forEach(n=>{$(n).hidden=n!==name;$('tab-'+n).classList.toggle('active',n===name);$('tab-'+n).setAttribute('aria-selected',n===name);});if(name==='stats')renderStats();}
function save(next){try{localStorage.setItem(KEY,JSON.stringify(next));records=next;return true;}catch(e){$('message').textContent='保存失败：浏览器存储不可用或空间已满。请导出已有记录备份。';return false;}}
function renderStats(){const sorted=[...records].sort((a,b)=>a.date.localeCompare(b.date));const sums=[0,0,0,0];sorted.forEach(r=>totals(r).slice(0,4).forEach((m,i)=>sums[i]+=m));const days=sorted.length?Math.floor((Date.parse(today())-Date.parse(sorted[0].date))/86400000)+1:0;$('period').textContent=sorted.length?`从 ${sorted[0].date} 开始，截至 ${today()}，共 ${days} 天（含首尾日期）。`:'加入第一条记录后，这里将显示从起始日期到今天的累计投入。';$('summary').innerHTML=`<div><small>累计项目投入</small><div class="big">${fmt(sums.reduce((a,b)=>a+b,0))}</div></div><div><small>已记录天数</small><div class="big">${sorted.length} 天</div></div><div title="项目一至项目四累计总时长 ÷ 起始日期至今天的天数（含首尾日期），四舍五入到分钟"><small>每天工作</small><div class="big">${fmt(days ? Math.round(sums.reduce((a,b)=>a+b,0)/days) : 0)}</div></div>`;const max=Math.max(...sums,1);$('chart').innerHTML=sums.map((m,i)=>`<div class="chartrow"><div class="chartlabel"><strong>${NAMES[i]}</strong><span>${fmt(m)}</span></div><div class="track"><div class="fill" style="width:${m/max*100}%"></div></div></div>`).join('');renderDaily(sorted);renderHistory(sorted);}
function showResult(r){const t=totals(r);$('result').hidden=false;$('result').innerHTML=`<div class="row"><div><h2>${r.date} 分析结果</h2><small>已识别 ${r.entries.length} 个时间段，共 ${fmt(t.reduce((a,b)=>a+b,0))}（含杂、小说）</small></div></div>${r.warnings.map(w=>`<div class="warning">${esc(w)}</div>`).join('')}${NAMES.map((n,i)=>`<div class="group"><div class="row"><h3>${n}</h3><strong>${fmt(t[i])}</strong></div>${r.entries.some(e=>e.category===i)?'<ul>'+r.entries.filter(e=>e.category===i).map(e=>`<li>${e.label} · ${fmt(e.minutes)}${e.notes?'<div class="muted">'+esc(e.notes).replace(/\n/g,'<br>')+'</div>':''}</li>`).join('')+'</ul>':'<small>无时间段</small>'}</div>`).join('')}<div class="group"><h3>无法归类的内容（${r.unknown.length} 项）</h3>${r.unknown.length?r.unknown.map(u=>`<div class="warning"><strong>第 ${u.line} 行起：${u.reason}</strong><pre>${esc(u.text)}</pre></div>`).join(''):'<small>全部内容均已归类。</small>'}</div><div class="result-actions"><button id="add" class="primary" ${r.entries.length?'':'disabled'}>加入列表</button></div>`;$('add').onclick=()=>{if(records.some(x=>x.date===r.date)&&!confirm(`${r.date} 已有记录，是否用本次结果替换？`))return;if(save([...records.filter(x=>x.date!==r.date),r])){$('message').textContent='';tab('stats');window.scrollTo({top:0,behavior:'smooth'});}};}
$('tab-stats').onclick=()=>tab('stats');$('tab-input').onclick=()=>tab('input');document.querySelector('nav').onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const n=e.key==='Home'?'stats':e.key==='End'?'input':$('stats').hidden?'stats':'input';tab(n);$('tab-'+n).focus();}};
$('source').addEventListener('paste',e=>{if(!e.clipboardData)return;const text=e.clipboardData.getData('text/plain');e.preventDefault();const cleaned=text.replace(/\r\n?/g,'\n').replace(/[\u2028\u2029\v]/g,'\n').split('\n').map(line=>line.trimEnd()).filter(line=>line.trim()).join('\n');const box=$('source');box.setRangeText(cleaned,box.selectionStart,box.selectionEnd,'end');box.dispatchEvent(new Event('input',{bubbles:true}));});
$('source').oninput=()=>{$('count').textContent=`${[...$('source').value].length} / 3000 字`;$('result').hidden=true;current=null;};$('reset').onclick=()=>{$('source').value='';$('source').oninput();$('message').textContent='内容已重置，已保存的记录不受影响。';};$('analyze').onclick=()=>{try{current=analyzeText($('source').value);showResult(current);$('message').textContent='分析完成，请核对后加入列表。';$('result').scrollIntoView({behavior:'smooth'});}catch(e){$('result').hidden=true;$('message').textContent=e.message;}};

const COLORS=['#216c5a','#558579','#969f5b','#c09a60'];
function renderHistory(sorted){$('history').innerHTML=sorted.length?[...sorted].reverse().map(r=>`<div class="history"><div class="row"><strong>${r.date}</strong><span>项目 ${fmt(totals(r).slice(0,4).reduce((a,b)=>a+b,0))} <button class="danger" data-delete="${r.date}">删除</button></span></div><small>${r.entries.length} 个时间段 · 杂 ${fmt(totals(r)[4])} · 小说 ${fmt(totals(r)[5])} · 未归类 ${r.unknown.length} 项</small><details><summary>查看原始记录</summary><pre>${esc(r.raw)}</pre></details></div>`).join(''):'<div class="empty">还没有记录，请到内容页添加。</div>';}
function renderDaily(sorted){$('daily-detail').hidden=true;$('daily-legend').innerHTML=NAMES.slice(0,4).map((n,i)=>`<span><i style="background:${COLORS[i]}"></i>${n}</span>`).join('');if(!sorted.length){$('daily').innerHTML='<div class="empty">加入记录后显示每日柱形图。</div>';return;}const rows=sorted.map(r=>({date:r.date,values:totals(r).slice(0,4)}));const peak=Math.max(60,...rows.map(r=>r.values.reduce((a,b)=>a+b,0)));const tick=Math.max(30,Math.ceil(peak/4/30)*30),top=tick*4;const width=Math.max(320,rows.length*72+52),height=286,plot=200,base=230,slot=(width-52)/rows.length;let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" role="img" aria-label="每天项目一至四用时的堆叠柱形图"><text x="2" y="13" fill="#637773" font-size="11">小时</text>`;for(let i=0;i<=4;i++){const y=base-i*plot/4;svg+=`<line x1="42" x2="${width}" y1="${y}" y2="${y}" stroke="#dce6df"/><text x="36" y="${y+4}" text-anchor="end" fill="#637773" font-size="11">${(i*tick/60).toFixed(i*tick%60?1:0)}</text>`;}
rows.forEach((r,i)=>{const x=52+i*slot+(slot-34)/2;let y=base;const total=r.values.reduce((a,b)=>a+b,0);const label=r.date+'，'+r.values.map((v,j)=>NAMES[j]+' '+fmt(v)).join('，');svg+=`<g data-day="${r.date}" role="button" tabindex="0" aria-label="${label}"><title>${label}</title><rect x="${52+i*slot}" y="20" width="${slot}" height="250" fill="transparent"/>`;r.values.forEach((v,j)=>{const h=v/top*plot;y-=h;svg+=`<rect x="${x}" y="${y}" width="34" height="${h}" fill="${COLORS[j]}"/>`;});svg+=`<text x="${x+17}" y="${y-7}" text-anchor="middle" font-size="11" fill="#203b38">${Math.floor(total/60)}h${String(total%60).padStart(2,'0')}m</text><text x="${x+17}" y="250" text-anchor="middle" fill="#637773" font-size="12">${+r.date.slice(5,7)}/${+r.date.slice(8)}</text><text x="${x+17}" y="267" text-anchor="middle" fill="#637773" font-size="10">${r.date.slice(0,4)}</text></g>`;});$('daily').innerHTML=svg+'</svg>';}
function selectDay(e){const g=e.target.closest('[data-day]');if(!g)return;const r=records.find(r=>r.date===g.dataset.day);if(!r)return;$('daily-detail').hidden=false;$('daily-detail').innerHTML=`<strong>${r.date} · 共 ${fmt(totals(r).slice(0,4).reduce((a,b)=>a+b,0))}</strong><br>`+totals(r).slice(0,4).map((m,i)=>`${NAMES[i]}：${fmt(m)}`).join('<br>');}
$('daily').onclick=selectDay;$('daily').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectDay(e);}};
$('go-input').onclick=()=>{tab('input');$('source').focus();};
$('history').onclick=e=>{const b=e.target.closest('[data-delete]');if(b&&confirm(`删除 ${b.dataset.delete} 的记录？`)&&save(records.filter(r=>r.date!==b.dataset.delete))){renderStats();$('message').textContent='记录已删除。';}};

$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,records:records.map(r=>({date:r.date,raw:r.raw}))},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=`工作记录备份-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('import').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024)throw Error('备份文件过大（最多 5 MB）。');const data=JSON.parse(await f.text());if(data.version!==1||!Array.isArray(data.records))throw Error('备份格式不正确。');const incoming=data.records.map(r=>{if(typeof r.raw!=='string')throw Error('记录缺少原始文本。');const a=analyzeText(r.raw);if(!a.entries.length)throw Error('备份中存在没有有效时间段的记录。');if(a.date!==r.date)throw Error('备份日期与正文不一致。');return a;});if(new Set(incoming.map(r=>r.date)).size!==incoming.length)throw Error('备份内存在重复日期。');const duplicates=incoming.filter(r=>records.some(x=>x.date===r.date)).length;if(duplicates&&!confirm(`有 ${duplicates} 个日期已存在，导入会替换这些日期。是否继续？`))return;const dates=new Set(incoming.map(r=>r.date));if(save([...records.filter(r=>!dates.has(r.date)),...incoming])){renderStats();$('message').textContent=`已导入 ${incoming.length} 天记录。`;}}catch(err){$('message').textContent='导入失败：'+err.message;}finally{e.target.value='';}};
try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(saved))throw Error();records=saved.map(r=>analyzeText(r.raw));}catch(e){$('message').textContent='本地记录无法读取，请先保留浏览器数据，并使用备份恢复。';}
renderStats();
</script></body></html>
